<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME SHOP - PRO JAILBREAK</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --neon-blue: #00f3ff;
    --neon-purple: #b000ff;
    --dark-bg: rgba(5, 8, 14, 0.9);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh;
    background: #000 url('bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    display: flex; align-items: center; justify-content: center;
    direction: rtl; overflow: hidden;
  }

  /* تعتيم الخلفية */
  body::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.9) 100%);
    z-index: 0;
  }

  /* الحاوية الأساسية (تصميم مضلع) */
  .hud-container {
    position: relative; z-index: 1; width: 95%; max-width: 900px;
    background: var(--dark-bg);
    border: 2px solid var(--neon-blue);
    clip-path: polygon(40px 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%, 0 40px);
    padding: 40px 30px;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
  }

  .hud-container::after {
    content: ''; position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(45deg, var(--neon-blue), var(--neon-purple));
    z-index: -1; clip-path: polygon(40px 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0 100%, 0 40px);
  }

  /* العناوين */
  .brand-title {
    font-family: 'Orbitron', sans-serif; font-size: 4.5rem; font-weight: 900;
    text-align: center; margin-bottom: 5px; letter-spacing: 4px; direction: ltr;
    background: linear-gradient(to right, var(--neon-blue), #ffffff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.6));
  }

  .brand-sub {
    font-size: 1.5rem; text-align: center; color: var(--neon-purple);
    font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
    text-shadow: 0 0 10px rgba(176, 0, 255, 0.5); margin-bottom: 20px; direction: ltr;
  }

  .engineer-badge {
    display: table; margin: 0 auto 30px; background: var(--neon-purple);
    color: #fff; padding: 5px 30px; font-size: 1.3rem; font-weight: 900;
    clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
    box-shadow: 0 0 20px rgba(176, 0, 255, 0.5);
  }

  /* شاشة الفحص */
  .status-panel {
    background: rgba(0, 0, 0, 0.6); padding: 20px; border-radius: 8px;
    border-right: 4px solid var(--neon-blue); margin-bottom: 25px;
    position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  }

  .status-panel::before {
    content: 'SYS_CHK'; position: absolute; top: -12px; left: 15px;
    background: var(--neon-blue); color: #000; padding: 2px 10px;
    font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: bold; border-radius: 4px;
  }

  #state { font-size: 26px; font-weight: 900; color: var(--neon-blue); text-align: center; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
  #det { font-size: 18px; color: #cbd5e1; text-align: center; line-height: 1.8; }
  #det b { color: #fff; background: rgba(0, 243, 255, 0.2); padding: 2px 8px; border-radius: 4px; }
  #cache { font-size: 15px; color: #8192a8; text-align: center; margin-top: 15px; font-weight: bold; }
  #cache.cacheok { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.5); }
  .ok { color: #00ff88; } .bad { color: #ff0055; } .warn { color: #fdd663; }

  /* كروت التواصل */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .contact-card {
    background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
  }
  .contact-card.full { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; text-align: right; }
  .contact-card:hover { border-color: var(--neon-purple); background: rgba(176, 0, 255, 0.1); box-shadow: 0 0 15px rgba(176, 0, 255, 0.3); }
  
  .c-title { color: var(--neon-blue); font-size: 14px; font-weight: 800; margin-bottom: 5px; display: block; }
  .full .c-title { margin-bottom: 0; margin-left: 15px; font-size: 16px; }
  .c-val { color: #fff; font-size: 18px; font-weight: 900; direction: ltr; }
  .full .c-val { font-size: 15px; direction: rtl; line-height: 1.5; flex: 1; }

  .footer-sys { position: fixed; bottom: 10px; right: 20px; font-family: 'Orbitron', sans-serif; font-size: 12px; color: rgba(255,255,255,0.3); letter-spacing: 2px; z-index: 2; }

  @media (max-width: 600px) {
    .brand-title { font-size: 3rem; } .contact-grid { grid-template-columns: 1fr; }
    .contact-card.full { flex-direction: column; text-align: center; }
    .full .c-title { margin-left: 0; margin-bottom: 5px; } .full .c-val { text-align: center; }
  }
</style>
</head>
<body>

<div class="hud-container">
  
  <h1 class="brand-title">GAME SHOP</h1>
  <div class="brand-sub">PS4 Jailbreak 11.00 - 12.00 - 13.00</div>
  <div class="engineer-badge">مهندس : محمود فتحى</div>

  <div class="status-panel">
    <div id="state">جارٍ فحص النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>

  <div class="contact-grid">
    <div class="contact-card full">
      <span class="c-title">📍 العنوان:</span>
      <span class="c-val">المنصورة حى الجامعة شارع الإيمان، أول شارع بجوار الجامعة بلازا، مطعم هوت ميكس (موجودين فى نص الشارع).</span>
    </div>
    <div class="contact-card">
      <span class="c-title">📱 الموبايل</span>
      <span class="c-val">01024388999<br>01024244499</span>
    </div>
    <div class="contact-card">
      <span class="c-title">☎️ الأرضي</span>
      <span class="c-val" style="line-height: 2.5;">0502370475</span>
    </div>
  </div>

</div>

<div class="footer-sys">GAME SHOP OS v2.0</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");

    function setState(t, c) { stateEl.innerHTML = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = "> " + t; cacheEl.className = ok ? "cacheok" : ""; }

    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");

    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "تم التحديد يدوياً ?bug=" + forced;
    } else if (!key) {
        why = "تحذير: هذا المتصفح ليس بلايستيشن 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = "النظام مدعوم: توجيه مسار (Lapse)";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = "النظام مدعوم: توجيه مسار (Poops)";
    } else {
        why = "تحذير: هذا الإصدار غير مدعوم حالياً";
    }

    var fwDisplay = key ? "<b>V_" + key + "</b>" : "<span style='color:#8f9eb0;'>UNKNOWN</span>";
    var bugDisplay = bug ? "<b style='color:var(--neon-purple);'>" + bug.toUpperCase() + "_CHAIN</b>" : "<span style='color:#8f9eb0;'>N/A</span>";

    detEl.innerHTML = "OS_VERSION: " + fwDisplay + " | EXPLOIT: " + bugDisplay + "<br><br><span style='color: var(--neon-blue); font-size:16px;'>" + why + "</span>";

    if (!bug) { setState("إصدار غير مدعوم ACCESS DENIED", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html") + location.search;

    function go() {
        setState("جارٍ تهيئة الثغرة INITIATING...", "warn");
        setTimeout(function() { location.replace(target); }, 500);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) { go(); }
    else if (!navigator.onLine) { setCache("وضع الأوفلاين نشط", true); go(); }
    else if (ac.status === ac.IDLE) { setCache("ملفات الكاش جاهزة للاستخدام", true); go(); }
    else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تحميل التحديث بنجاح", true);
        waitForTap("تحديث جاهز — اضغط للتنفيذ", function () { location.reload(); });
    } else {
        setCache("جارٍ فحص التخزين المؤقت...");
        ac.addEventListener("downloading", function () { setCache("يتم سحب الملفات للمرة الأولى..."); }, false);
        ac.addEventListener("progress", function (e) { if (e && e.total) { setCache("جاري التخزين: " + Math.round((e.loaded / e.total) * 100) + "%"); } }, false);
        ac.addEventListener("cached", function () { setCache("اكتمل التخزين — يمكنك الاستخدام بدون نت", true); waitForTap("النظام جاهز — اضغط للتشغيل", go); }, false);
        ac.addEventListener("updateready", function () { try { ac.swapCache(); } catch (e) {} setCache("التحديث جاهز", true); waitForTap("تحديث متوفر — اضغط لإعادة التحميل", function () { location.reload(); }); }, false);
        ac.addEventListener("noupdate", function () { setCache("التخزين المؤقت محدث وجاهز", true); go(); }, false);
        ac.addEventListener("error", function () { setCache("حدث خطأ في سحب الكاش"); waitForTap("فشل التخزين — اضغط للتشغيل الإجباري", go); }, false);
        ac.addEventListener("obsolete", function () { setCache("ملفات الكاش قديمة"); waitForTap("تنبيه ملفات قديمة — اضغط للتشغيل", go); }, false);
    }
})();
</script>
</body>
</html>
